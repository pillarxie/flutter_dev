name: Desktop baseline
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
            library: libflutter_dev_core.dylib
          - os: windows-2022
            platform: windows
            library: flutter_dev_core.dll
          - os: ubuntu-22.04
            platform: linux
            library: libflutter_dev_core.so
    runs-on: ${{ matrix.os }}
    env:
      FLUTTER_DEV_SETTINGS_PATH: ${{ github.workspace }}/build/ci-test-settings/settings.json
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev clang
      - run: flutter pub get
      - run: cargo fmt --manifest-path rust/Cargo.toml -- --check
      - run: cargo test --manifest-path rust/Cargo.toml --locked
      - run: cargo build --manifest-path rust/Cargo.toml --lib --locked
      - run: cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings
      - run: flutter analyze
      - run: flutter test --dart-define=FLUTTER_DEV_NATIVE_LIBRARY=${{ github.workspace }}/rust/target/debug/${{ matrix.library }}
      - run: flutter build ${{ matrix.platform }} --release
