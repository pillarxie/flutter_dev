name: flutter_dev
description: Independent Flutter desktop run and debug workbench.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_dev_core:
    path: rust_builder
  flutter_rust_bridge: 2.12.0
  file_selector: ^1.1.0
  url_launcher: ^6.3.2
  flutter_inappwebview: 6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app-icon-128.png
