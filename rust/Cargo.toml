[package]
name = "flutter_dev_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "1"
flutter_rust_bridge = "=2.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
notify = "8.2.0"
url = "2"
tokio-tungstenite = "0.28"
futures-util = "0.3"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
